<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy Japanese</title>
  <meta name="description" content="Lernbegleiter zu Minna no Nihongo: Vokabeln, Grammatik, Zahlen, Zählwörter und Japanisch für die Reise.">
  <meta name="theme-color" content="#f7f2ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Happy Japanese">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/app.css">
  <script>
    // Apply the saved theme and font size before the first paint, so nothing jumps.
    try {
      const t = JSON.parse(localStorage.getItem('happyjapanese.theme'));
      if (t) document.documentElement.dataset.theme = t;
      const z = JSON.parse(localStorage.getItem('happyjapanese.size'));
      if (z) document.documentElement.dataset.size = z;
    } catch (e) {}
  </script>
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <div id="app" class="app"><div class="boot"><span class="spinner" aria-label="Lädt"></span></div></div>

  <nav class="tabbar" id="tabbar" hidden>
    <a href="#/" data-tab="home"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>Start</span></a>
    <a href="#/bereiche" data-tab="areas"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span>Bereiche</span></a>
    <a href="#/fortschritt" data-tab="stats"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg><span>Fortschritt</span></a>
    <a href="#/listen" data-tab="lists"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/></svg><span>Nachschlagen</span></a>
    <a href="#/einstellungen" data-tab="settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M2.5 12h3M18.5 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg><span>Einstellungen</span></a>
  </nav>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:2rem">Happy Japanese braucht JavaScript.</p></noscript>
</body>
</html>
